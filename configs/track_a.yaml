# Track A -- order-sensitive message (docs/CREST_PLAN.md section 5).
#
# Differences from configs/crest_v1.yaml only; everything unlisted is
# inherited from it. Starts from the phase-2 checkpoint.
#
# The DistMult message x * z_r is replaced by m = U (z_r * (V x)) with one
# 32x32 (U, V) pair per layer (crest/messages.py::BilinearMessage), both
# initialised to the identity so step 0 *is* DistMult, exactly.
#
# Keep rule: mean relation MRR rises by at least 0.02 over the phase 1
# baseline. Entity prediction is reported with the same message.

base: crest_v1.yaml

message:
  class: BilinearMessage
  dim: 32
  per_layer: true
  init: identity
