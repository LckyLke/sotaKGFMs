# INCITE phase 2.1b -- THE WALKS REVIVAL EXPERIMENT.
#
# Phase 2.1 (configs/incite_phase21_walks.yaml) failed its kill switch:
# results/incite/PHASE21_RESULT.md records capability without supervision --
# all 220 PETALS ties broken (mean margin 0.26) at chance accuracy (0.47 vs
# the 0.90 bar), because FB15k237 / WN18RR / CoDExMedium contain no
# automorphic candidate pairs and the walk GRU never saw a gradient telling
# it which way to break a tie. This config is that config plus the missing
# supervision: a small fraction of steps train on synthetic PETALS-family
# instances with a LABELED true tail (incite/synth.py).
#
# Identical to incite_phase21_walks.yaml (walks ON, support OFF, relation
# lambda 0) except for the `synth:` block. Warm start from the PHASE-1 FLOOR
# (INCITE_INIT_FROM=<phase-1 incite_best.pth>), not from the phase-2.1
# checkpoint: the lever under test is walks+supervision against the same
# floor phase 2.1 was measured against.
#
# KILL SWITCH UNCHANGED (docs/INCITE_PLAN.md phase 2.1): PETALS accuracy
# >= 90%, with DEV10 within noise of the phase-1 floor. Read the PETALS
# number knowing the synthetic family OVERLAPS the diagnostic BY DESIGN --
# it is a train-distribution score, evidence that supervision aligned the
# pathway at all, never a generalization claim. The benchmark (41 graphs)
# is what carries any claim.
model:
  dim: 32
  rounds: 6
  layer_norm: yes
  short_cut: yes
  count_channel: yes
  num_mlp_layer: 2

walks:
  enabled: yes            # THE phase 2.1 lever
  num_walks: 32
  walk_length: 8
  seed: 1024

support:
  enabled: no             # phase 2.2 lever
  num_positive: 16
  per_relation_cap: 64
  neg_per_pos: 4
  prototype_k: 16
  hops: 3
  ball_cap: 1024
  class_prior: 0.1
  build_batch_size: 16

relation:
  lambda: 0.0             # phase 2.3 lever

synth:
  enabled: yes            # phase 2.1b: symmetry-breaking supervision
  fraction: 0.05          # "a small fraction of steps" (PHASE21_RESULT.md)
  instances_per_step: 16
  seed: 2048              # NOT the eval instances' 1024

train:
  batch_size: 32
  accum_steps: 1
  checkpoint_activations: yes
  num_negative: 512
  strict_negative: yes
  adversarial_temperature: 1
  lr: 5.0e-4
  steps: 20000
  val_interval: 1000
  refresh_interval: 500
  cost_gate: 0.20
  val_samples: 500
  graphs: [FB15k237, WN18RR, CoDExMedium]

seed: 1024
