# PG3 (2026-09-04): MX1's recipe plus the gate that can close. PG2's gate
# started at bias 6 (slope 0.0025) with a one-sided loss and stayed the
# identity (results/incite/GATE_RESULT.md). Here: bias 2 (still the exact
# identity at the warm start, forty times the gradient, room to close), the
# two-sided proof loss on synthetic steps (proof edges open, non-proof
# edges of the same instance shut through the gate product), soft weights
# at inference, no cutting. Warm start with MX1's synthetic stream
# (step_offset). Paired against MX1; a recipe candidate.
model:
  gate: yes               # PG3: the proof-guided gate
  gate_bias: 2.0          # PG3: the start logit (PG2: 6.0, inert)
  dim: 32
  rounds: 6
  layer_norm: yes
  short_cut: yes
  count_channel: yes      # both channels stay: they are section A, not a lever
  num_mlp_layer: 2

walks:
  enabled: no             # phase 2.1 lever
  num_walks: 32
  walk_length: 8
  seed: 1024

support:
  enabled: no             # phase 2.2 lever
  num_positive: 16
  per_relation_cap: 64
  neg_per_pos: 4
  prototype_k: 16
  hops: 3
  ball_cap: 1024
  class_prior: 0.1
  build_batch_size: 16

relation:
  lambda: 0.0             # phase 2.3 lever

synth:
  prior: rules            # the latent rule-system prior (RULES_PRIOR.md)
  enabled: yes
  fraction: 0.3           # about 3,000 synthetic steps in a 10k continuation
  instances_per_step: 16
  seed: 2048
  step_offset: 20000      # a warm start counts from step 1; MX1 (resumed)
                          # counted from 20001: same coin, same instances
  proof_weight: 0.02     # PG3: the gate term is SUMMED over the six rounds and
                          # starts at about 6.0 (0.25 + 0.5 x 1.49 per round at
                          # bias 2); 0.02 makes it the size of the task loss
                          # (0.14, MX1's average; 0.32 on
                          # the first batch) so that the trunk is not swamped
  proof_neg_per_pos: 2    # PG3: non-proof edges per proof edge, pushed shut
  proof_neg_weight: 0.29  # PG3: -2 log s - w log(1 - s^2) is flat at s = sigmoid(2)
                          # for w = 1/s^2 - 1 = 0.289: a gate that cannot tell proof
                          # from non-proof edges stays the identity instead of
                          # damping every message to 0.86 (w = 0.5 would)

train:
  batch_size: 16          # NELL995: 74.5k nodes OOMs single-piece 32 (S8 log)
  accum_steps: 2          # effective 32; memory-forced for the 4-graph mix
  checkpoint_activations: yes
  num_negative: 512
  strict_negative: yes
  adversarial_temperature: 1
  lr: 5.0e-4
  steps: 20000
  val_interval: 1000
  refresh_interval: 500
  cost_gate: 0.20
  val_samples: 500
  graphs: [FB15k237, WN18RR, CoDExMedium]

seed: 1024
