# PG2 (2026-09-03): MX1's recipe plus the proof-guided propagation gate
# (results/incite/GATE_RULES_DESIGN.md). One EdgeGate per round, exactly the
# identity at the warm start; on synthetic steps the generator's proof edges
# train it one-sidedly open (synth.proof_weight), the task loss trains it
# everywhere. The MX1 synthetic steps are kept as they were (MX2's bundle of
# generator-side changes lost, SYNTH_V2_RESULT.md). Paired against MX1.
model:
  gate: yes               # PG2: the proof-guided gate
  dim: 32
  rounds: 6
  layer_norm: yes
  short_cut: yes
  count_channel: yes      # both channels stay: they are section A, not a lever
  num_mlp_layer: 2

walks:
  enabled: no             # phase 2.1 lever
  num_walks: 32
  walk_length: 8
  seed: 1024

support:
  enabled: no             # phase 2.2 lever
  num_positive: 16
  per_relation_cap: 64
  neg_per_pos: 4
  prototype_k: 16
  hops: 3
  ball_cap: 1024
  class_prior: 0.1
  build_batch_size: 16

relation:
  lambda: 0.0             # phase 2.3 lever

synth:
  prior: rules            # the latent rule-system prior (RULES_PRIOR.md)
  enabled: yes
  fraction: 0.3           # about 3,000 synthetic steps in a 10k continuation
  instances_per_step: 16
  seed: 2048
  proof_weight: 1.0       # PG2: the one-sided proof loss on the gate

train:
  batch_size: 16          # NELL995: 74.5k nodes OOMs single-piece 32 (S8 log)
  accum_steps: 2          # effective 32; memory-forced for the 4-graph mix
  checkpoint_activations: yes
  num_negative: 512
  strict_negative: yes
  adversarial_temperature: 1
  lr: 5.0e-4
  steps: 20000
  val_interval: 1000
  refresh_interval: 500
  cost_gate: 0.20
  val_samples: 500
  graphs: [FB15k237, WN18RR, CoDExMedium]

seed: 1024
