# Track C -- one network for both tasks (docs/CREST_PLAN.md section 5).
#
# Differences from configs/crest_v1.yaml only. Starts from the phase-2
# checkpoint. One shared encoder, both readouts, both banks
# (crest/model.py::CRESTJoint); batches alternate entity/relation one to one
# (crest/train.py::joint), stage A then stage B.
#
# Keep rule: each task stays within 0.005 MRR of its separate model on all 41.

base: crest_v1.yaml

joint:
  alternate: [entity, relation]   # strict 1:1 alternation
  share_encoder: true

relation_readout:
  # same architecture as the entity readout; separate parameters and bank
  width: 128
  depth: 2
  heads: 4
